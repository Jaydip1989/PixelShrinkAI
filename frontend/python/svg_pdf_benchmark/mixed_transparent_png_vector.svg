<?xml version="1.0" encoding="UTF-8"?>
    <svg
        xmlns="http://www.w3.org/2000/svg"
        width="1200"
        height="800"
        viewBox="0 0 1200 800">

        <!-- Transparent raster layer -->
        <image
            x="100"
            y="80"
            width="1000"
            height="640"
            href="data:image/png;base64,"
            preserveAspectRatio="none" />
        
        <!-- Vector layers above transparent raster -->

        <rect
            x="130"
            y="110"
            width="940"
            height="580"
            fill="none"
            stroke="#ff0000"
            stroke-width="10" />
        
        <circle
            cx="300"
            cy="230"
            r="75"
            fill="#00ff00"
            fill-opacity="0.65"
            stroke="#000000"
            stroke-width="6" />
        
        <ellipse
            cx="850"
            cy="240"
            rx="120"
            ry="70"
            fill="#0000ff"
            fill-opacity="0.75"
            stroke="#ffffff"
            stroke-width="7" />
        
        <polygon
            points="600,130 680,300 520,300"
            fill="#ffff00"
            fill-opacity="0.75"
            stroke="#000000"
            stroke-width="6" />
        
        <line
            x1="180"
            y1="600"
            x2="1020"
            y2="600"
            stroke="#ff00ff"
            stroke-width="12" />
        
        <path
            d="M 250 500
            C 400 380, 500 620, 650 500
            S 900 380, 1000 500"

            fill="none"
            stroke="#00ffff"
            stroke-width="12" />
    </svg>
