<?xml version="1.0" encoding="UTF-8"?>
<svg
    xmlns="http://www.w3.org/2000/svg"
    width="1000"
    height="600"
    viewBox="0 0 1000 600">

    <!-- ================================================= -->
    <!-- VECTOR LAYER 1 — MUST APPEAR BEHIND THE RASTER   -->
    <!-- ================================================= -->

    <rect
        x="50"
        y="50"
        width="900"
        height="500"
        fill="none"
        stroke="#000000"
        stroke-width="20" />

    <circle
        cx="180"
        cy="120"
        r="70"
        fill="#00ff00"
        stroke="#000000"
        stroke-width="8" />


    <!-- ================================================= -->
    <!-- RASTER LAYER                                    -->
    <!-- ================================================= -->

    <image
        x="100"
        y="80"
        width="800"
        height="440"
        href="data:image/png;base64,"
        preserveAspectRatio="none" />


    <!-- ================================================= -->
    <!-- VECTOR LAYER 2 — MUST APPEAR ABOVE THE RASTER   -->
    <!-- ================================================= -->

    <rect
        x="150"
        y="150"
        width="700"
        height="300"
        fill="none"
        stroke="#ff0000"
        stroke-width="12" />

    <circle
        cx="500"
        cy="300"
        r="90"
        fill="#00ff00"
        fill-opacity="0.55"
        stroke="#0000ff"
        stroke-width="10" />

    <path
        d="M 180 480
           C 300 350, 400 550, 520 430
           S 750 350, 820 480"
        fill="none"
        stroke="#ff00ff"
        stroke-width="12" />

</svg>
